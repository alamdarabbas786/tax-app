version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: airport_mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: RootPass123!
      MYSQL_DATABASE: airport_taxi
      MYSQL_USER: appuser
      MYSQL_PASSWORD: AppPass123!
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pRootPass123!"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: