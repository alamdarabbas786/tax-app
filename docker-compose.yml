version: '3.9'

services:
  php:
    build: .
    container_name: airport_taxi_php
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    command: ["php", "-S", "0.0.0.0:9000", "-t", "public"]

  nginx:
    image: nginx:1.25
    container_name: airport_taxi_nginx
    depends_on:
      - php
    ports:
      - '3000:80'
    volumes:
      - ./:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    image: postgres:16
    container_name: airport_taxi_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: airport_taxi_redis
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: