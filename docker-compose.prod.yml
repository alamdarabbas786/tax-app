version: '3.9'

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: airport_taxi_php
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MYSQL_DSN: ${MYSQL_DSN}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
      ADMIN_BASIC_USER: ${ADMIN_BASIC_USER:-admin}
      ADMIN_BASIC_PASS: ${ADMIN_BASIC_PASS:-change-me}
      ADMIN_BEARER_TOKEN: ${ADMIN_BEARER_TOKEN:-change-me}
      ADMIN_WEB_USER: ${ADMIN_WEB_USER:-admin}
      ADMIN_WEB_PASS: ${ADMIN_WEB_PASS:-admin123}
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25-alpine@sha256:516475cc129da42866742567714ddc681e5eed7b9ee0b9e9c015e464b4221a00
    container_name: airport_taxi_nginx
    depends_on:
      - php
    ports:
      - '3000:80'
    volumes:
      - ./public:/app/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "80"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    container_name: airport_taxi_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: airport_taxi_redis
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
